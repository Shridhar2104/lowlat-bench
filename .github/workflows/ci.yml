name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-16
            container: gcc:16
            cxx: g++
          - name: gcc-14
            container: ""
            cxx: g++-14
          - name: clang-18
            container: ""
            cxx: clang++-18
    steps:
      - uses: actions/checkout@v5

      - name: Install CMake + Ninja
        run: |
          if [ "$(id -u)" = 0 ]; then SUDO=""; else SUDO="sudo"; fi
          $SUDO apt-get update -qq
          $SUDO apt-get install -y -qq cmake ninja-build git

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DLLB_WERROR=ON

      - name: Build
        run: cmake --build build

      # Shared CI runners are noisy: this only proves every benchmark runs.
      # Real numbers come from a quiet local machine (see README).
      - name: Smoke-run benchmarks
        run: |
          for b in build/bench/*; do
            echo "::group::$b"
            "$b" --benchmark_min_time=0.01s
            echo "::endgroup::"
          done

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned clang-format
        run: pipx install clang-format==23.1.3
      - name: Check formatting
        run: clang-format --dry-run --Werror bench/*.cpp
